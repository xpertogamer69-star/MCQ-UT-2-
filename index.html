<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You </title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: white;
    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 420px;
    padding: 35px 25px;
    text-align: center;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
}

.heart {
    font-size: 60px;
    animation: beat 1s infinite;
}

@keyframes beat {
    50% { transform: scale(1.15); }
}

h1 {
    margin: 10px 0;
}

p {
    line-height: 1.6;
}

input {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    outline: none;
    text-align: center;
    font-size: 16px;
    margin: 15px 0;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: white;
    color: #ff4f81;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

#error {
    color: #ffe1e1;
    margin-top: 10px;
    display: none;
}

#secret {
    display: none;
}

.message {
    margin-top: 20px;
    padding: 20px;
    background: rgba(255,255,255,0.15);
    border-radius: 15px;
    text-align: left;
}
</style>
</head>

<body>

<div class="container">

    <div id="login">

        <div class="heart">❤️</div>

        <h1>Something For You</h1>

        <p>
            There is a little surprise waiting for you...
            <br>
            Only you can unlock it.
        </p>

        <input 
            type="password" 
            id="password" 
            placeholder="Enter your birthdate"
        >

        <button onclick="unlock()">Unlock ❤️</button>

        <p id="error">Wrong password 🥺</p>

    </div>


    <div id="secret">

        <div class="heart">💗</div>

        <h1>For You ❤️</h1>

        <div class="message">

            <p>
                Hey love,
            </p>

            <p>
                Yahan tumhare liye mera last message hai...
            </p>

            <p>
                <b>
                YAHAN APNA LAST MESSAGE LIKHNA HAI ❤️
                </b>
            </p>

            <p>
                Take care of yourself. 🫶
            </p>

        </div>

    </div>

</div>


<script>

function unlock() {

    const password = document.getElementById("password").value;

    // YAHAN GF KA BIRTHDATE DALO
    // Example: 29 December 2008 = 29122008

    const correctPassword = "1132008";

    if (password === correctPassword) {

        document.getElementById("login").style.display = "none";
        document.getElementById("secret").style.display = "block";

    } else {

        document.getElementById("error").style.display = "block";

    }
}

</script>

</body>
</html>
